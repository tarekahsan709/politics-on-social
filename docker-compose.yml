version: '3.7'

services:
  # Apache Superset
  superset:
    image: apache/superset:latest
    container_name: campaign_superset
    environment:
      - SUPERSET_SECRET_KEY=your_secret_key_here_change_this
      - DATABASE_DB=campaign_db
      - DATABASE_HOST=postgres
      - DATABASE_PASSWORD=campaign_secure_password
      - DATABASE_USER=campaign_user
      - DATABASE_PORT=5432
      - DATABASE_DIALECT=postgresql
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SUPERSET_LOAD_EXAMPLES=no
    ports:
      - "8088:8088"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./superset_config.py:/app/pythonpath/superset_config.py
      - ./custom_visualizations:/app/custom_viz
      - superset_home:/app/superset_home
    networks:
      - campaign_network

  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: campaign_postgres
    environment:
      - POSTGRES_DB=campaign_db
      - POSTGRES_USER=campaign_user
      - POSTGRES_PASSWORD=campaign_secure_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_scripts:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - campaign_network

  # Redis for caching
  redis:
    image: redis:7-alpine
    container_name: campaign_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - campaign_network

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: campaign_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl_certs:/etc/nginx/ssl
    depends_on:
      - superset
    networks:
      - campaign_network

  # Optional: Metabase for comparison
  metabase:
    image: metabase/metabase:latest
    container_name: campaign_metabase
    environment:
      - MB_DB_TYPE=postgres
      - MB_DB_DBNAME=metabase_db
      - MB_DB_PORT=5432
      - MB_DB_USER=campaign_user
      - MB_DB_PASS=campaign_secure_password
      - MB_DB_HOST=postgres
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    networks:
      - campaign_network

volumes:
  postgres_data:
  redis_data:
  superset_home:

networks:
  campaign_network:
    driver: bridge